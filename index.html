<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1729">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>もんすたーふゅーじょんっ！</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Jersey+15&display=swap">
<style>
/* layout: one fixed phone screen, no page scroll. top bar / stage (direction map + culture tank) / breakdown notes / drawer (3 step tabs, tray, action bar). 1 game pixel = 2 CSS px. */
:root{
  color-scheme:dark;
  --void:#0f1729; --deep:#131c35; --panel:#1e2a4a; --raise:#2a3861; --edge:#3f5290; --edge-hi:#7088d0; --out:#070b16;
  --ink:#f3f6ff; --dim:#a8b4d8; --faint:#6d7db0;
  --fluid:#56e8c3; --fluid-d:#1c8a78; --fuse:#ff5c9e; --fuse-d:#a92762; --gold:#ffd25e; --gold-d:#a8771a; --bad:#ff8068;
  --paper:#f6efdc; --paper-ink:#2b2842; --hanko:#e2422f;
  --f-px:'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  --f-num:'Jersey 15','DotGothic16','Hiragino Kaku Gothic ProN',sans-serif;
  --f-big:'Dela Gothic One','DotGothic16','Hiragino Kaku Gothic ProN',sans-serif;
  --f-read:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--void);background-image:linear-gradient(180deg,rgba(63,82,144,.3),rgba(15,23,41,0) 46%),var(--bg-tile,none);background-size:auto,32px 32px;color:var(--ink);font:12px/1.35 var(--f-px);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img,svg{display:block;pointer-events:none}
b{font-weight:400}
i{font-style:normal}
.px{image-rendering:crisp-edges;image-rendering:pixelated}
.cut{clip-path:polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px))}
.fr{border-style:solid;border-color:transparent;border-width:6px;border-image-slice:6 fill;border-image-width:6px;border-image-repeat:stretch}
.fr.well{border-image-source:var(--fr-well)}
.fr.panel{border-image-source:var(--fr-panel)}
.fr.paper{border-image-source:var(--fr-paper)}

#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
@media (max-height:540px){body{overflow:auto}#app{height:540px}}

/* ---- top bar ---- */
.top{flex:none;display:flex;align-items:center;gap:8px;height:34px}
.qtag{flex:1;min-width:0;height:34px;display:flex;align-items:center;gap:6px;color:var(--paper-ink);padding:0 2px}
.qtag .hk{flex:none;font:10px/15px var(--f-big);padding:0 3px;color:var(--hanko);border:2px solid var(--hanko);border-radius:3px;transform:rotate(-5deg)}
.qtag b{font-size:13px;white-space:nowrap;min-width:0}
.stat{flex:none;display:flex;align-items:center;gap:4px;font:20px/1 var(--f-num)}
.stat small{font:10px/1 var(--f-px);color:var(--dim);margin-left:1px}
.ibtn{flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--dim);border-width:6px 6px 10px;border-image-slice:6 6 10 fill;border-image-width:6px 6px 10px;border-image-source:var(--fr-ghost)}
.ibtn:active{border-image-source:var(--fr-ghost-dn);transform:translateY(4px)}

/* ---- stage ---- */
.stage{flex:none;display:grid;grid-template-columns:min(188px,52%) minmax(0,1fr);gap:8px}
.map{position:relative;width:100%;aspect-ratio:1;align-self:start}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.ax{position:absolute;font-size:9.5px;line-height:1;color:var(--dim);text-shadow:1px 0 #0d1429,-1px 0 #0d1429,0 1px #0d1429,0 -1px #0d1429;white-space:nowrap}
.ax.t{top:2px;left:50%;transform:translateX(-50%)}
.ax.b{bottom:2px;left:50%;transform:translateX(-50%)}
.ax.l{left:2px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%)}
.ax.r{right:2px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%)}
.zst{position:absolute;font-size:10px;line-height:15px;padding:0 4px;white-space:nowrap}
.zst.c-lt{left:2px;top:2px}.zst.c-rt{right:2px;top:2px}.zst.c-lb{left:2px;bottom:2px}.zst.c-rb{right:2px;bottom:2px}
.zst.in{background:var(--fluid);color:#06261f}
.zst.out{background:#0d1429;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.side{display:flex;flex-direction:column;gap:4px;min-width:0}
.tank{position:relative;flex:1 1 60px;min-height:60px}
.tank canvas{position:absolute;inset:0;width:100%;height:100%}
.tank #kid{position:absolute;left:50%;bottom:-8px;width:80px;height:80px;margin-left:-40px}
.tank .tq{position:absolute;inset:0;display:grid;place-items:center;font:38px/1 var(--f-num);color:var(--faint)}
.tk{position:absolute;left:2px;top:2px;font-size:9.5px;line-height:14px;padding:0 4px}
.tk.sp{background:var(--fuse);color:#fff}
.tk.aw{background:var(--gold);color:#3a2800}
.tk.fm{left:auto;top:auto;right:2px;bottom:2px;background:var(--c,#888);color:#0d1429}
.stamp{position:absolute;right:4px;top:-4px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-align:center;font:10.5px/1.05 var(--f-big);color:var(--hanko);border:3px solid var(--hanko);background:rgba(246,239,220,.94);transform:rotate(-12deg)}
.stamp.in{animation:stamp .28s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.5);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.kname{display:flex;align-items:center;gap:6px;font-size:13px;line-height:17px;white-space:nowrap;min-width:0}
.kname.dimt{color:var(--dim);font-size:12px}
.fam{flex:none;font-size:9.5px;line-height:13px;padding:0 3px;background:var(--c,#888);color:#0d1429}
.ktot{display:flex;align-items:baseline;gap:5px;white-space:nowrap;height:26px}
.ktot .tl{font-size:10px;color:var(--dim)}
.ktot .tv{font:34px/26px var(--f-num)}
.ktot .tv.off{color:var(--faint)}
.need{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--dim)}
.need.ok{color:var(--fluid)}.need.ng{color:var(--bad)}
.reqs{display:flex;flex-wrap:wrap;gap:3px 4px;align-content:flex-start}
.rq{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 5px 0 4px;font-size:10.5px;background:var(--paper);color:var(--paper-ink);white-space:nowrap}
.rq .bx{width:10px;height:10px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #9c937c}
.rq.ok .bx{box-shadow:none;color:#12876c}.rq.ng .bx{box-shadow:none;color:var(--hanko)}

/* ---- notes ---- */
.notes{flex:none;height:36px;overflow:hidden auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 10px;font-size:10.5px;line-height:18px;scrollbar-width:none}
.notes::-webkit-scrollbar{display:none}
.notes .f{width:100%;display:flex;gap:10px;white-space:nowrap;color:var(--dim)}
.notes .f b{font:17px/18px var(--f-num);color:var(--ink);margin-left:3px}
.notes .f b.g{color:var(--fluid)}.notes .f b.b{color:var(--bad)}
.nt{white-space:nowrap}
.nt.hx{color:var(--dim);white-space:normal;line-height:16px;margin-top:2px}
.nt.cmb{color:var(--gold)}.nt.g{color:var(--fluid)}.nt.b{color:var(--bad)}.nt.m{color:var(--dim)}.nt.sp{color:#ff9cc4}

/* ---- drawer ---- */
.drawer{flex:1;min-height:0;display:flex;flex-direction:column;margin-left:calc(var(--gl)*-1);margin-right:calc(var(--gr)*-1)}
.tabs{position:relative;z-index:1;flex:none;display:flex;gap:4px;align-items:flex-end;padding-left:var(--gl);padding-right:var(--gr)}
.tab{flex:1 1 auto;min-width:0;height:42px;margin-bottom:2px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;background:#172041;border:2px solid #2b3a6b;border-bottom:0;color:var(--dim);font-size:11.5px;white-space:nowrap;clip-path:polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% 100%,0 100%)}
.tab.on{height:46px;margin-bottom:0;background:var(--panel);border-color:var(--edge);color:var(--ink)}
.tab:first-child{flex:0 0 auto}
.tab:disabled{opacity:.5}
.tab.next{border-color:var(--fuse);color:#fff;animation:nx 1s steps(2,jump-none) infinite}
@keyframes nx{from{background:#172041}to{background:#4a2456}}
.slots{display:flex;gap:3px}
.slot{position:relative;width:28px;height:28px;background:#111936;box-shadow:inset 0 0 0 2px #2b3a6b;overflow:hidden}
.slot.f{background:#22305a;box-shadow:inset 0 0 0 2px var(--fuse)}
.slot img{position:absolute;left:-6px;top:-6px;width:40px;height:40px;max-width:none}
.slot.bl::after{content:"血";position:absolute;left:0;top:0;font-size:8.5px;line-height:10px;padding:0 1px;background:var(--fuse-d);color:#fff}
.slot.bl.f::after{background:var(--fuse)}
.pips{display:flex;gap:2px}
.pip{width:10px;height:16px;background:#111936;box-shadow:inset 0 0 0 2px #2b3a6b}
.pip.f{background:var(--fuse);box-shadow:inset 0 0 0 2px #ffa3cb}
.pip.k.f{background:var(--gold);box-shadow:inset 0 0 0 2px #fff0b8}
.dbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--edge);margin-top:-2px;padding-left:var(--gl);padding-right:var(--gr)}
.tray{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 0;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.hint{margin:0 0 5px;font-size:10.5px;line-height:15px;color:var(--dim)}
.hint:empty{display:none}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px 6px}

/* monster card */
.mc{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-areas:"hd hd" "art tg";gap:3px 6px;align-content:start;padding:4px 6px 5px;min-width:0;background:var(--raise);border:2px solid var(--edge);border-bottom:4px solid #1a2547}
.mc .hd{grid-area:hd;display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:0 4px}
.mc .nm{font-size:12px;line-height:14px;white-space:nowrap}
.mc .meta{display:flex;align-items:center;gap:5px;height:14px;white-space:nowrap}
.mc .tl{font-size:9.5px;color:var(--dim)}
.mc .tv{font:19px/14px var(--f-num)}
.mm{box-shadow:0 0 0 1px #34457a}
.mc .mm{grid-column:2;grid-row:1/3}
.mm.in{box-shadow:0 0 0 1px var(--fluid)}
.mc .art{grid-area:art;position:relative;width:48px;height:48px;overflow:hidden;background:#172042}
.mc .art img{position:absolute;left:-6px;top:-6px;width:60px;height:60px;max-width:none}
.mc .tg{grid-area:tg;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;align-self:center}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10px;line-height:14px;white-space:nowrap;padding-right:2px}
.st.lg{font-size:9px}
.st.t2{color:#a9e4ff}.st.t3{color:var(--gold)}
.st.cmb{background:rgba(255,210,94,.14);box-shadow:0 0 0 1px var(--gold-d)}
.st.none{color:var(--faint)}
.qk{font-size:9.5px;line-height:12px;color:#ffb19f}
.why{font-size:9.5px;line-height:12px;color:var(--bad)}
.rb{position:absolute;left:0;top:0;z-index:1;font-size:9.5px;line-height:13px;padding:0 3px;background:#5b6fa8;color:#fff}
.rb.bl{background:var(--fuse)}
.mc.on{background:#3b2a5e;border-color:var(--fuse);border-bottom-color:var(--fuse-d)}
.mc.on .art{background:#51306a}
.mc.dis{opacity:.42}
.mc:active:not(.dis),.sc:active:not(.dis){transform:translateY(2px)}
.pop{animation:pop .16s steps(3,end)}
@keyframes pop{from{transform:scale(.94)}60%{transform:scale(1.03)}to{transform:none}}

/* skill chip */
.sc{position:relative;display:grid;grid-template-columns:14px 26px minmax(0,1fr);align-items:center;gap:0 5px;height:44px;padding-right:6px;min-width:0;background:var(--raise);border:2px solid var(--edge);border-bottom:4px solid #1a2547}
.sc .src{align-self:stretch;display:grid;place-items:center;font-size:9.5px;background:#1a2548;color:var(--dim)}
.sc .src.b{background:var(--fuse-d);color:#fff}
.sc .src.k{background:var(--gold-d);color:#201500}
.sc .pl{width:26px;height:26px;display:grid;place-items:center;background:#111936;box-shadow:inset 0 0 0 2px #1d2850}
.sc .bd{min-width:0;display:flex;flex-direction:column;gap:1px}
.sc .nm{font-size:11.5px;line-height:15px;white-space:nowrap}
.sc .nm.lg{font-size:10.5px}
.sc.t2 .nm{color:#a9e4ff}.sc.t3 .nm{color:var(--gold)}
.sc .sub{display:flex;align-items:center;gap:5px;font-size:10px;line-height:13px;color:var(--dim);white-space:nowrap}
.sc .vx{letter-spacing:-.02em}
.sc .val{margin-left:auto;font:17px/13px var(--f-num);color:var(--gold)}
.mk{font-size:9.5px;line-height:12px;padding:0 2px}
.mk.g{color:#06261f;background:var(--fluid)}
.mk.b{color:#fff;background:#c9483a}
.mk.c1{color:var(--gold);padding:0}
.mk.c2{color:#201500;background:var(--gold)}
.mk.fee{color:var(--gold)}.mk.fee.ng{color:var(--bad)}
.sc.on{background:#472a5e;border-color:var(--fuse);border-bottom-color:var(--fuse-d)}
.sc.on .pl{background:#2a1740}
.sc.kp.on{background:#4a3c1c;border-color:var(--gold);border-bottom-color:var(--gold-d)}
.sc.c2:not(.on){border-color:var(--gold);border-bottom-color:var(--gold-d)}
.sc.dis{opacity:.4}
.empty{grid-column:1/3;padding:18px 0;text-align:center;color:var(--faint);font-size:11px}

/* action bar */
.act{flex:none;display:flex;gap:8px;padding:4px 0 10px}
.btn{height:50px;border-width:6px 6px 10px;border-image-slice:6 6 10 fill;border-image-width:6px 6px 10px;text-align:center;white-space:nowrap}
.btn.go{flex:1;border-image-source:var(--fr-btn);font:17px/32px var(--f-big);color:#fff;text-shadow:0 2px 0 var(--fuse-d);letter-spacing:.06em}
.btn.go:active:not(:disabled){border-image-source:var(--fr-btn-dn);transform:translateY(4px)}
.btn.go:disabled{border-image-source:var(--fr-btn-off);font:12.5px/34px var(--f-px);letter-spacing:0;color:var(--faint);text-shadow:none;cursor:default}
.btn.ghost{flex:none;min-width:78px;padding:0 6px;border-image-source:var(--fr-ghost);font-size:12.5px;line-height:34px;color:var(--ink)}
.btn.ghost:active{border-image-source:var(--fr-ghost-dn);transform:translateY(4px)}

/* ---- overlays ---- */
#fx,#sheet{position:fixed;inset:0;z-index:20}
#sheet{z-index:30}
#fxcv{position:absolute;inset:0;width:100%;height:100%}
.fxui{position:absolute;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:calc(env(safe-area-inset-top,0px) + 170px) calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;scrollbar-width:none}
.fxui.res{padding-top:calc(env(safe-area-inset-top,0px) + 214px)}
.fxui::-webkit-scrollbar{display:none}
.fxin{animation:fxin .25s steps(4,end) both}
@keyframes fxin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.talk{display:flex;align-items:flex-start;gap:8px;padding:2px 4px}
.talk .who{flex:none;font-size:10px;line-height:16px;padding:0 5px;background:var(--fuse);color:#fff}
.talk p{margin:0;font-size:12.5px;line-height:17px}
.fxt{margin:0;font:15px/1.2 var(--f-big);letter-spacing:.06em;text-align:center}
.opts{display:flex;flex-direction:column;gap:7px}
.oc{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:8px 10px 8px 8px;background:var(--raise);border:2px solid var(--edge);border-bottom:4px solid #1a2547}
.oc:active{transform:translateY(2px);border-color:var(--fuse)}
.oc .ob{display:flex;flex-direction:column;gap:3px;min-width:0}
.oc .on{font:14px/1.15 var(--f-big);letter-spacing:.04em}
.oc.swing .on{color:#ff9cc4}.oc.bonus .on{color:var(--gold)}
.oc .od{font-size:10.5px;line-height:14px;color:var(--dim)}
.oc .ot{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.oc .tl{font-size:9.5px;color:var(--dim)}
.oc .tv{font:30px/24px var(--f-num)}
.och{display:flex;flex-wrap:wrap;gap:3px}
.oc .rq{height:16px;font-size:10px}
.pass{font-size:10px;line-height:16px;padding:0 5px;background:var(--fluid);color:#06261f;white-space:nowrap}
.banner{align-self:center;font:16px/1 var(--f-big);letter-spacing:.14em;padding:7px 14px 8px;background:var(--fuse);color:#fff;text-shadow:0 2px 0 var(--fuse-d)}
.banner.gold{background:var(--gold);color:#3a2800;text-shadow:0 2px 0 #fff0b8}
.rhead{display:flex;align-items:baseline;justify-content:center;gap:10px;white-space:nowrap}
.rhead .rnm{font-size:16px}
.rhead .tl{font-size:10px;color:var(--dim)}
.rhead .tv{font:38px/1 var(--f-num)}
.rcard{display:flex;flex-direction:column;gap:6px;padding:4px 6px 6px}
.rsk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 10px}
.rs{display:flex;align-items:center;gap:6px;font-size:11.5px;line-height:16px;white-space:nowrap;min-width:0}
.rs.t2{color:#a9e4ff}.rs.t3{color:var(--gold)}
.rs .val{margin-left:auto;font:16px/1 var(--f-num);color:var(--gold)}
.rlog{font-size:10.5px;line-height:15px;color:var(--dim)}
.rlog .qk{font-size:10.5px}
.fxui .act{margin-top:auto;padding-bottom:0}

.shade{position:absolute;inset:0;background:rgba(6,9,20,.72)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;max-height:82%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));animation:up .18s steps(4,end) both;scrollbar-width:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-size:14px;line-height:1.3}
.sheet .small{font-size:10.5px;color:var(--dim);margin:0;line-height:15px}
.dh{display:flex;align-items:center;gap:10px}
.dh .big{flex:none;width:80px;height:80px;background:#172042}
.dh .big img{width:80px;height:80px}
.dh .tv{font:30px/1 var(--f-num)}
.dl{display:flex;flex-direction:column;gap:6px}
.dr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:0 8px;align-items:center}
.dr .pl{width:26px;height:26px;display:grid;place-items:center;background:#111936}
.dr .n{font-size:12px}
.dr .n.t2{color:#a9e4ff}.dr .n.t3{color:var(--gold)}
.dr .d{grid-column:2/4;font:11px/1.5 var(--f-read);color:var(--dim)}
.dr .val{font:17px/1 var(--f-num);color:var(--gold)}
.tagp{font-size:9.5px;line-height:13px;padding:0 4px;background:#34457a;color:var(--ink);margin-left:6px}
.scn{display:flex;flex-direction:column;gap:2px;padding:9px 10px;background:var(--raise);border:2px solid var(--edge);border-bottom:4px solid #1a2547}

/* ---- monster math ---- */
function rel(t1,t2){
  if(t1==='mediate'||t2==='mediate'||t1==='tune'||t2==='tune')return 'n';
  if(t1===t2)return 'g';
  const has=L=>L.some(p=>(p[0]===t1&&p[1]===t2)||(p[0]===t2&&p[1]===t1));
  if(has(GOOD))return 'g';if(has(BAD))return 'b';return 'n';
}
function pairInfo(set){
  const g=[],b=[];
  for(let i=0;i<set.length;i++)for(let j=i+1;j<set.length;j++){const r=rel(SK[set[i]].tag,SK[set[j]].tag);if(r==='g')g.push([set[i],set[j]]);if(r==='b')b.push([set[i],set[j]]);}
  return {g,b,med:set.some(s=>SK[s].tag==='mediate')};
}
/* lvs: levels aligned with ids (array), or a {skill:level} map.
   The same skill twice merges into one and gains +1 (plus both levels).
   A further combo carries over half of its ingredients' total plus, rounded down (a lone +1 is lost). */
function resolveSkills(ids,lvs){
  const set=[],combos=[],boosts=[],lv={};
  ids.forEach((s,i)=>{const l=Array.isArray(lvs)?(lvs[i]||0):((lvs&&lvs[s])||0);if(set.includes(s)){lv[s]+=l+1;boosts.push(s)}else{set.push(s);lv[s]=l}});
  let cur=set,ch=true;
  while(ch){ch=false;for(const c of COMBO){if(cur.includes(c[0])&&cur.includes(c[1])){const n=Math.floor((lv[c[0]]+lv[c[1]])/2);cur=cur.filter(x=>x!==c[0]&&x!==c[1]);delete lv[c[0]];delete lv[c[1]];
    if(cur.includes(c[2])){lv[c[2]]+=n+1;boosts.push(c[2])}else{cur.push(c[2]);lv[c[2]]=n}combos.push(c);ch=true;break;}}}
  const set2=cur;
  const lvo={};set2.forEach(s=>{if(lv[s])lvo[s]=lv[s]});
  return {set:set2,combos,lv:lvo,boosts};
}
/* skill levels: +1 adds 30% of the skill's own base value (rounded up) */
const COMBO_OUT=new Set(COMBO.map(c=>c[2]));
function lvOf(m,s){return (m&&m.lv&&m.lv[s])||0}
function skVal(sk,lv){const v=SK[sk].val;return v+(lv||0)*Math.ceil(v*0.3)}
function skName(sk,lv){return SK[sk].n+(lv?'+'+lv:'')}
function famBase(m){return m.sp?SPX[m.sp].p:FAM[m.fam].p}
function basePos(m){return m.o||famBase(m)}
const BOARD=20;
function vecOf(m,s){return (m&&m.vo&&m.vo[s])||SK[s].v}
function posSteps(m){
  const b=basePos(m);let x=b[0],y=b[1];const pts=[[x,y]];
  m.skills.forEach(s=>{const v=vecOf(m,s);x+=v[0];y+=v[1];pts.push([x,y])});
  if(m.quirk){x+=QK[m.quirk].v[0];y+=QK[m.quirk].v[1];pts.push([x,y])}
  const med=m.skills.filter(s=>SK[s].tag==='mediate').length;
  for(let i=0;i<med;i++){x*=0.7;y*=0.7}
  const fin=[r1(clamp(x,-BOARD,BOARD)),r1(clamp(y,-BOARD,BOARD))];
  return {pts,med,fin};
}
function posOf(m){return posSteps(m).fin}
function breakdown(m){
  const p=pairInfo(m.skills);
  const sv=m.skills.reduce((a,s)=>a+skVal(s,lvOf(m,s)),0);
  const pg=m.quirk==='kuchi'?0:p.g.length*PAIR_GOOD, pb=p.med?0:p.b.length*PAIR_BAD;
  const sx=m.sp?SPX_BONUS:0;
  const pre=m.core+sv+pg-pb+sx;
  const aw=m.awake?Math.round(pre*0.1):0;
  return {core:m.core,sv,pg,pb,sx,aw,total:Math.max(1,Math.round(pre+aw)),p};
}
function totalOf(m){return breakdown(m).total}
function stageOf(m){const t=totalOf(m);let s=0;STAGE_T.forEach((v,i)=>{if(t>=v)s=i});return s}
function nameOf(m){return (m.awake?'覚醒':'')+(m.sp?SPX[m.sp].n:STAGE_N[m.fam][stageOf(m)])}
function inZone(q,m){const [x,y]=posOf(m);return Math.hypot(x-q.zone[0],y-q.zone[1])<=q.zone[2]+1e-9}
function distOut(q,m){const [x,y]=posOf(m);return Math.max(0,Math.hypot(x-q.zone[0],y-q.zone[1])-q.zone[2])}

function makeQuest(ch){
  if(ch<=10){const s=STORY[ch];return {ch,free:false,title:s.title,days:s.days,budget:s.budget,zone:[...s.zone],total:s.total,expect:s.expect,extra:s.extra.map(e=>({...e})),brief:s.brief,reveal:s.reveal,tut:!!s.tut};}
  const n=ch-10;const ang=Math.random()*Math.PI*2;const d=4+Math.random()*12;
  const zone=[r1(Math.cos(ang)*d),r1(Math.sin(ang)*d),3.9];
  const extra=[];const roll=Math.random();
  if(roll<.4)extra.push({t:'fam',v:pick(FAMS)});else if(roll<.7)extra.push({t:'tag',v:pick(['cute','charm','power','dignity','holy','smart','calm','dark','wild','speed'])});
  const total=Math.min(1200,700+n*30);
  const titles=['なんか強いやつ','映える子','ひたすら賢い子','かわいくて偉い子','硬そうなやつ','癒し担当','謎の大型案件'];
  return {ch,free:true,title:pick(titles),days:15,budget:240,zone,total,expect:total+100,extra,
    brief:[['sasa','フリー依頼です。今回の要件はこちらです'],['eki',pick(['合体し放題の日々、最高すぎる','用途は聞かない。合体できればいい','依頼書を見るだけで手が震えてきた'])]],
    reveal:[['sasa',pick(FREE_REVEAL)],['eki',pick(['用途はいつも斜め上だね','次！ 次の合体！','私の子が役に立ってる……'])]],tut:false};
}
function reqList(q){const L=[{t:'zone'}];if(q.total>0)L.push({t:'total',v:q.total});return L.concat(q.extra)}
function reqCheck(q,r,m){
  if(!m)return {ok:false,cur:''};
  switch(r.t){
    case 'zone':{const o=inZone(q,m);return {ok:o,cur:o?'ゾーン内':'あと'+r1(distOut(q,m))+'ずれ'};}
    case 'total':{const t=totalOf(m);return {ok:t>=r.v,cur:String(t)};}
    case 'fam':return {ok:m.fam===r.v,cur:FAM[m.fam].n};
    case 'skill':{const h=m.skills.includes(r.v);return {ok:h,cur:h?'所持':'なし'};}
    case 'tag':{const h=m.skills.some(s=>SK[s].tag===r.v);return {ok:h,cur:h?'所持':'なし'};}
    case 't3':{const c=m.skills.filter(s=>SK[s].t===3).length;return {ok:c>=r.v,cur:c+'個'};}
  }
  return {ok:false,cur:''};
}
function reqText(r){
  switch(r.t){
    case 'zone':return '目標ゾーンの中に収めること';
    case 'total':return '総合値 '+r.v+'以上';
    case 'fam':return FAM[r.v].n+'であること';
    case 'skill':return 'スキル「'+SK[r.v].n+'」を持つこと';
    case 'tag':return TAG[r.v]+'系のスキルを持つこと';
    case 't3':return '★3スキルを'+r.v+'個以上';
  }
}
function reqShort(r,q){
  switch(r.t){
    case 'zone':return 'ゾーン内';case 'total':return '総合'+r.v+'+';case 'fam':return FAM[r.v].n;
    case 'skill':return '「'+SK[r.v].n+'」';case 'tag':return TAG[r.v]+'系スキル';case 't3':return '★3×'+r.v;
  }
}
function famNames(fs){return fs.map(f=>FAM[f].n).join('・')}
function hintFor(r){
  if(r.t==='skill'){const sk=r.v;const has=famsHaving(sk);const rc=recipeOf(sk);let h='';
    if(rc){h+='「'+SK[rc[0]].n+'」＋「'+SK[rc[1]].n+'」を両方受け継がせると、合体後にできあがる。';
      const a=famsHaving(rc[0]),b=famsHaving(rc[1]);h+=' '+SK[rc[0]].n+'は'+(a.length?famNames(a):'合成でのみ')+'、'+SK[rc[1]].n+'は'+(b.length?famNames(b):'合成でのみ')+'がよく持っている。';
      const rr=[recipeOf(rc[0]),recipeOf(rc[1])].filter(Boolean);rr.forEach(x=>h+=' '+SK[x[2]].n+'は「'+SK[x[0]].n+'」＋「'+SK[x[1]].n+'」で作れる。');}
    if(has.length)h+=(rc?' 完成品は':'')+famNames(has)+'が持っていることもある。';
    return h;}
  if(r.t==='tag'){const fs=FAMS.filter(f=>[1,2].some(t=>FPOOL[f][t].some(s=>SK[s].tag===r.v)));return TAG[r.v]+'系のスキルは'+famNames(fs)+'がよく持っている。';}
  if(r.t==='fam')return FAM[r.v].n+'を血統（1体目）にすれば、生まれる子はその系統になる。指名買いが便利。';
  if(r.t==='t3')return '★3スキルは、◆スキル同士の合成で作るか、強い個体がたまに持っている。';
  return '';
}
function allOk(q,m){return reqList(q).every(r=>reqCheck(q,r,m).ok)}

/* ---- meta / run ---- */
function newMeta(){return {v:4,rp:0,fac:{},chapter:1,zSp:{},zSpx:{},zCombo:{},zSk:{},runs:0,wins:0,ended:false,seen:false,best:{},hideTips:false}}
const F=(meta,id)=>!!meta.fac[id];
function invCap(meta){return 6+(F(meta,'cage')?2:0)}
function bankCap(meta){return 4+(F(meta,'bank')?3:0)}
function bankFee(sk,lv){return Math.round(skVal(sk,lv)*0.8)+3}
function showFit(m,q){const p=posOf(m);const d=Math.hypot(p[0]-q.zone[0],p[1]-q.zone[1]);return clamp(1-d/24,0,1)}
function showPay(m,q){return Math.round(totalOf(m)*(0.22+0.25*showFit(m,q)))}
function unitCore(ch){return 16+Math.min(ch,12)*6}
function regM(meta,m){meta.zSp[m.fam+stageOf(m)]=1;if(m.sp)meta.zSpx[m.sp]=1;m.skills.forEach(s=>meta.zSk[s]=1)}

function jit(){return r1((Math.random()*2-1)*2)}
function makeMon(fam,core,skills,quirk){const b=FAM[fam].p;return {id:uid(),fam,sp:null,o:[r1(b[0]+jit()),r1(b[1]+jit())],core:Math.max(1,Math.round(core)),skills:[...new Set(skills)],vo:{},quirk:quirk||null,awake:false,gen:0}}
function rollMon(fam,kind,ch){
  const U=unitCore(ch);const P=FPOOL[fam];let core,sk,qk=null;
  if(kind==='trash'){core=U*(0.18+Math.random()*0.12);sk=Math.random()<.5?[pick(P[1])]:[];}
  else if(kind==='weak'){core=U*(0.45+Math.random()*0.2);sk=[pick(P[1])];}
  else if(kind==='norm'){core=U*(0.85+Math.random()*0.3);sk=shuffle(P[1]).slice(0,rnd(1,2));if(Math.random()<.35)sk.push(pick(P[2]));}
  else if(kind==='strong'){core=U*(1.7+Math.random()*0.4);sk=[pick(P[2]),pick(P[1])];if(Math.random()<.25)sk.push(pick(P[2]));}
  else if(kind==='elite'){core=U*(2.6+Math.random()*0.5);sk=[pick(P[2]),pick(P[2])];if(Math.random()<.5)sk.push(pick(P[3]));if(Math.random()<.4)qk=pick(QKS);}
  else if(kind==='carrier'){core=U*(0.5+Math.random()*0.2);sk=[pick(P[3])];if(Math.random()<.5)qk=pick(QKS);}
  else if(kind==='rich'){core=U*(0.9+Math.random()*0.2);sk=shuffle([...P[1],...P[2]]).slice(0,3);}
  return makeMon(fam,core,sk,qk);
}
function monValue(m){return m.core*0.55+m.skills.reduce((a,s)=>a+skVal(s,lvOf(m,s))*0.9,0)}
function bundle(label,mons,mul,free){
  const price=free?0:Math.max(5,Math.round(mons.reduce((a,m)=>a+monValue(m),0)*mul*(0.9+Math.random()*0.2)));
  return {label,mons,price,taken:false};
}
function precursors(sk,depth){const o=new Set([sk]);if(depth>0)COMBO.forEach(c=>{if(c[2]===sk){precursors(c[0],depth-1).forEach(x=>o.add(x));precursors(c[1],depth-1).forEach(x=>o.add(x))}});return o}
function genBundles(run,meta,kind,famPick){
  const ch=run.quest.free?12:run.ch;const fr=()=>famPick||pick(FAMS);
  const famReq=(run.quest.extra.find(e=>e.t==='fam')||{}).v;
  const out=[];
  if(kind==='black'){
    out.push(bundle('大量処分',Array.from({length:rnd(5,6)},()=>rollMon(fr(),'weak',ch)),0.5));
    out.push(bundle('格上一品',[rollMon(fr(),'elite',ch)],1.35));
    out.push(bundle('訳あり品',[rollMon(fr(),'carrier',ch)],1.1));
  }else{
    const kinds=shuffle(['main','pair','bulk','rich','main']).slice(0,2+(F(meta,'route')?1:0));
    kinds.forEach((k,i)=>{
      const f=()=>(i===0&&famReq&&!famPick)?famReq:fr();
      if(k==='main')out.push(bundle('本命＋おまけ',[rollMon(f(),'strong',ch),...Array.from({length:rnd(1,2)},()=>rollMon(fr(),'weak',ch))],0.85));
      else if(k==='pair')out.push(bundle('そこそこ2体',[rollMon(f(),'norm',ch),rollMon(f(),'norm',ch)],0.9));
      else if(k==='bulk')out.push(bundle('まとめ売り',Array.from({length:rnd(3,4)},()=>rollMon(f(),'weak',ch)),0.7));
      else out.push(bundle('スキル盛り',[rollMon(f(),'rich',ch)],0.95));
    });
    const skReq=run.quest.extra.filter(e=>e.t==='skill');
    if(skReq.length&&Math.random()<.6){const pre=[...precursors(pick(skReq).v,2)];const m=out[0].mons[0];const s=pick(pre);if(!m.skills.includes(s)){m.skills.push(s);out[0].price=Math.round(out[0].price+SK[s].val*0.9);}}
  }
  out.push(Math.random()<.5?bundle('無料サンプル',[rollMon(fr(),'weak',ch)],0,true):bundle('くそざこ詰め放題',Array.from({length:rnd(2,3)},()=>rollMon(fr(),'trash',ch)),0,true));
  return out;
}
function monForTotal(fam,target,ch,strong){
  const P=FPOOL[fam];let sk=strong?[pick(P[2]),pick(P[2])]:shuffle([...P[1],...P[2]]).slice(0,2);
  if(strong&&Math.random()<.35)sk.push(pick(P[3]));
  const m=makeMon(fam,1,sk);const rest=target-totalOf(m)+1;m.core=Math.max(5,Math.round(rest));return m;
}
function sellSkPrice(meta,sk,lv){return Math.round((skVal(sk,lv)*1.6+5)*(F(meta,'appraise')?1.2:1))}
function sellMonPrice(meta,m){return Math.round(totalOf(m)*0.4*(F(meta,'appraise')?1.2:1))}
function genTrades(run,meta){
  const ch=run.quest.free?12:run.ch;const U=unitCore(ch);const out=[];const H=homeInv(run);
  const tots=H.map(totalOf).sort((a,b)=>b-a);const best=tots[0]||U;
  const t2=Math.max(10,Math.round((tots[1]||best*0.7)*0.9));
  out.push({kind:'total',v:t2,text:'総合値'+t2+'以上の子を1体と交換',rew:{mons:[monForTotal(pick(FAMS),Math.round(t2*(1.0+Math.random()*0.15)),ch,false)]}});
  const fams=[...new Set(H.map(m=>m.fam))];
  if(fams.length){const f=pick(fams);const ft=H.filter(m=>m.fam===f).map(totalOf).sort((a,b)=>a-b)[0];
    out.push({kind:'fam',v:f,text:FAM[f].n+'の子を1体と交換',rew:{mons:[monForTotal(pick(FAMS.filter(x=>x!==f)),Math.round(ft*(1.0+Math.random()*0.15)),ch,false)]}});}
  if(Math.random()<.55&&H.length>=2){const t3=Math.round(best*0.9);
    out.push({kind:'total',v:t3,heavy:true,text:'総合値'+t3+'以上の子を1体と交換（重い依頼）',rew:{mons:[monForTotal(pick(FAMS),Math.round(best*(1.25+Math.random()*0.15)),ch,true)]}});}
  return out.slice(0,3);
}
function genSells(run,meta){
  const out=[];const H=homeInv(run);
  const tags=[...new Set(run.bank.map(b=>SK[b.sk].tag))].filter(t=>t!=='mediate');
  const allTags=Object.keys(TAG).filter(t=>!['mediate','tune'].includes(t));
  const t1=tags.length?pick(tags):pick(allTags);
  out.push({kind:'tag',v:t1,sell:true,text:TAG[t1]+'系のスキルを1つ買い取る（倉庫から）'});
  const fams=[...new Set(H.map(m=>m.fam))];const f=fams.length?pick(fams):pick(FAMS);
  out.push({kind:'fam',v:f,sell:true,text:FAM[f].n+'の子を1体買い取る'});
  const tots=H.map(totalOf).sort((a,b)=>b-a);const tv=Math.max(10,Math.round((tots[1]||tots[0]||40)*0.8));
  out.push({kind:'total',v:tv,sell:true,text:'総合値'+tv+'以上の子を1体買い取る'});
  return out;
}
function jobPrice(run,meta,job,c){if(!job.sell)return 0;if(c.type==='bank'){const b=run.bank.find(x=>x.u===c.id);return b?sellSkPrice(meta,b.sk,b.lv):0}const m=run.inv.find(x=>x.id===c.id);return m?sellMonPrice(meta,m):0}
function isAway(run,m){return m.back!=null&&run.day<=m.back}
function homeInv(run){return run.inv.filter(m=>!isAway(run,m))}
function jobCandidates(run,job){
  if(job.kind==='tag')return run.bank.filter(b=>SK[b.sk].tag===job.v).map(b=>({type:'bank',id:b.u,label:skName(b.sk,b.lv)}));
  if(job.kind==='fam')return homeInv(run).filter(m=>m.fam===job.v).map(m=>({type:'mon',id:m.id,label:nameOf(m)}));
  return homeInv(run).filter(m=>totalOf(m)>=job.v).map(m=>({type:'mon',id:m.id,label:nameOf(m)}));
}

document.addEventListener('pointermove',e=>{if(lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>9){clearTimeout(lpT);lpXY=null}});
['pointerup','pointercancel','scroll'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(lpT);lpXY=null},true));
document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-info]');if(el){e.preventDefault();clearTimeout(lpT);if(sheetEl.hidden){U.lp=true;U.sheet={k:'info',arg:el.dataset.info};renderSheet()}}});
window.addEventListener('resize',()=>{if(U.fx){const cv=$('fxcv');if(cv){cv.width=Math.ceil(fxEl.clientWidth/2);cv.height=Math.ceil(fxEl.clientHeight/2)}}else render()});
load();SND.music(musicFor());
if(G.run&&(!G.run.quest||!G.run.map))G.run=null;
if(G.run&&G.screen==='fuse'&&G.run.fs&&G.run.opts){render();const now=performance.now();fxOpen({st:'opts',t0:now,ts:now-300,parents:[],fin:G.run.fs.t==='final',many:false,pt:[],oy:0,res:null,flash:0});toOpts()}
else render();
requestAnimationFrame(loop);
